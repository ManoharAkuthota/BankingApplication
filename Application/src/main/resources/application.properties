# Application Name
spring.application.name=BankingApplication

# Server Configuration (Render assigns PORT dynamically)
server.port=${PORT:8080}

# Database Configuration (Supports local MySQL and cloud TiDB Serverless)
spring.datasource.url=${SPRING_DATASOURCE_URL:${TIDB_URL:jdbc:mysql://localhost:3306/banking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${TIDB_USER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${TIDB_PASSWORD:Manu@123}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# Hibernate Dialect (MySQLDialect is fully compatible with TiDB Serverless)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Liquibase Configuration
spring.liquibase.enabled=${SPRING_LIQUIBASE_ENABLED:true}
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO

# Jackson Configuration
spring.jackson.serialization.indent-output=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Actuator
management.endpoints.web.exposure.include=*

# JWT Configuration
jwt.secret=${JWT_SECRET:MySuperSecretKeyForBankingApplication2026}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Allowed Origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}