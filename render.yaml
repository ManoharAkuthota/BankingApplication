services:
  # -------------------------------------------------------------
  # Spring Boot Backend Web Service (Docker on Java 21)
  # -------------------------------------------------------------
  - type: web
    name: apex-trust-backend
    runtime: docker
    dockerfilePath: ./Application/Dockerfile
    dockerContext: ./Application
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      # TiDB Serverless connection details (configured via Render Dashboard)
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:4200,https://*.onrender.com"

  # -------------------------------------------------------------
  # Angular Frontend Static Site
  # -------------------------------------------------------------
  - type: web
    name: apex-trust-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: ./dist/frontend/browser
    envVars:
      - key: NODE_VERSION
        value: "22.22.3"
      - key: NG_FORCE_NODE_VERSION_CHECK
        value: "false"
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      # Support Angular client-side HTML5 routing
      - type: rewrite
        source: /*
        destination: /index.html
